# Canonical candidate: Qwen3.8 27B Q6_K on two RTX 5060 Ti 16GB cards.
# Model path is a placeholder. Text-only route (no mmproj). Keep context, f16 KV,
# split, and built-in MTP (n=2, p-min=0.1) settings unchanged when reproducing
# the measured evidence. This route is experimental: retrieval fit checks pass
# at ~115K, but sustained visible-output repeats did not consistently pass the
# strict gate.

[Qwen3.8-27B-Q6-dual-5060ti]
model = /path/to/Qwen3.8-27B-Q6_K.gguf
ctx-size = 131072
n-gpu-layers = 99
cache-type-k = f16
cache-type-v = f16
split-mode = tensor
tensor-split = 50,50
temp = 1.0
top-k = 20
top-p = 0.95
min-p = 0
presence-penalty = 0.0
repeat-penalty = 1.0
batch-size = 2048
ubatch-size = 512
jinja = on
parallel = 1
spec-type = draft-mtp
spec-draft-p-min = 0.1
spec-draft-n-max = 2
reasoning = on
