# Canonical candidate: ThinkingCap Qwen3.6 27B Q6_K on two RTX 5060 Ti 16GB cards.
# Model and projector paths are placeholders. Keep context, f16 KV, split, and
# built-in MTP settings unchanged when reproducing the published evidence.

[ThinkingCap-Qwen3.6-27B-Q6-dual-5060ti]
model = /path/to/ThinkingCap-Qwen3.6-27B-Q6_K-MTP.gguf
mmproj = /path/to/mmproj-BF16.gguf
mmproj-offload = false
image-min-tokens = 1024
ctx-size = 131072
n-gpu-layers = 99
cache-type-k = f16
cache-type-v = f16
split-mode = tensor
tensor-split = 50,50
temp = 1.0
top-k = 20
top-p = 0.95
min-p = 0
presence-penalty = 0.8
batch-size = 4096
ubatch-size = 1024
jinja = on
parallel = 1
spec-type = draft-mtp
spec-draft-p-min = 0.1
spec-draft-n-max = 3
reasoning-preserve = on
